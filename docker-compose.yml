services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-http://localhost:9000}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_URL_SERVER=${API_URL_SERVER:-http://localhost:8000/api/v1}
    restart: unless-stopped
